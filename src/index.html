<!DOCTYPE html>
<html lang="ja">
  <head>
    <base target="_top" />
    <!--
      meta タグは HtmlService に除去されるため、viewport は Code.gs の
      addMetaTag() で付与している。ここに書いても効かない。
    -->
    <style>
      :root {
        --bg: #f5f5f7;
        --card: #ffffff;
        --fg: #1c1c1e;
        --fg-dim: #6e6e73;
        --line: #e0e0e5;
        --in: #0a7d3e;
        --out: #b3261e;
        --brk: #8a5a00;
        --disabled: #d8d8dd;
        --disabled-fg: #9a9aa0;
        --badge-bg: #e8e8ed;
        --ok: #0a7d3e;
        --ng: #b3261e;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #1c1c1e;
          --card: #2c2c2e;
          --fg: #f2f2f7;
          --fg-dim: #98989f;
          --line: #3a3a3c;
          --in: #2f9e5c;
          --out: #e5534b;
          --brk: #c08a2e;
          --disabled: #3a3a3c;
          --disabled-fg: #6e6e73;
          --badge-bg: #3a3a3c;
          --ok: #2f9e5c;
          --ng: #e5534b;
        }
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 16px 16px 32px;
        background: var(--bg);
        color: var(--fg);
        font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans",
          "Noto Sans JP", sans-serif;
        -webkit-text-size-adjust: 100%;
      }

      .wrap {
        max-width: 480px;
        margin: 0 auto;
      }

      /* --- ヘッダー（日付 + 現在の勤務状態）--- */
      .head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 12px;
      }

      .date {
        font-size: 15px;
        color: var(--fg-dim);
      }

      .badge {
        flex: none;
        background: var(--badge-bg);
        color: var(--fg);
        border-radius: 999px;
        padding: 5px 14px;
        font-size: 14px;
        font-weight: 600;
      }

      .badge.on-duty {
        background: var(--in);
        color: #fff;
      }

      .badge.on-break {
        background: var(--brk);
        color: #fff;
      }

      /* --- 当日の打刻履歴 ---
         同日に複数ペアがありうるため（F-6）、件数は固定しない。 */
      .history {
        background: var(--card);
        border-radius: 14px;
        padding: 2px 16px;
        margin-bottom: 24px;
      }

      .punch-row {
        display: flex;
        align-items: baseline;
        gap: 14px;
        padding: 10px 0;
        border-bottom: 1px solid var(--line);
      }

      .punch-row:last-child {
        border-bottom: none;
      }

      .punch-time {
        font-size: 21px;
        font-weight: 600;
        font-variant-numeric: tabular-nums;
        flex: none;
      }

      .punch-title {
        font-size: 15px;
        color: var(--fg-dim);
      }

      .history-empty {
        padding: 16px 0;
        text-align: center;
        font-size: 15px;
        color: var(--disabled-fg);
      }

      /* --- 打刻ボタン（ADR-0022）---
         2列3行。min-height 88px と行間 32px は ADR-0011 の寸法を維持する。
         列間だけ 12px に詰めて「リモート出社」が折り返さない幅を確保する。
         押せないボタンは非表示にせず非活性にする（F-10）。位置が状態で動くと
         指の記憶が効かず、それ自体が誤タップの原因になるため。 */
      .buttons {
        display: grid;
        grid-template-columns: 1fr 1fr;
        column-gap: 12px;
        row-gap: 32px;
      }

      button.punch {
        width: 100%;
        min-height: 88px;
        padding: 8px;
        border: none;
        border-radius: 16px;
        /* 「リモート出社」6文字が折り返さない幅を、狭い端末でも確保する。
           iPhone SE（幅 320px）で1ボタン約 138px、iPhone 14（390px）で約 171px。 */
        font-size: clamp(17px, 5.1vw, 20px);
        font-weight: 700;
        letter-spacing: 0.02em;
        white-space: nowrap;
        color: #fff;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
        transition: transform 0.08s ease, opacity 0.15s ease;
      }

      button.punch:active:not(:disabled) {
        transform: scale(0.97);
      }

      button.punch:disabled {
        background: var(--disabled) !important;
        color: var(--disabled-fg) !important;
        cursor: default;
      }

      button.punch[data-group='in'] {
        background: var(--in);
      }

      button.punch[data-group='out'] {
        background: var(--out);
      }

      button.punch[data-group='break'] {
        background: var(--brk);
      }

      .spinner {
        display: inline-block;
        width: 16px;
        height: 16px;
        margin-right: 8px;
        vertical-align: -2px;
        border: 3px solid rgba(255, 255, 255, 0.35);
        border-top-color: #fff;
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
      }

      button.punch:disabled .spinner {
        border-color: rgba(0, 0, 0, 0.15);
        border-top-color: var(--disabled-fg);
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .spinner {
          animation-duration: 2s;
        }
        button.punch:active:not(:disabled) {
          transform: none;
        }
      }

      /* --- 設定・エラー --- */
      .guests {
        margin-top: 24px;
        text-align: center;
        font-size: 13px;
        color: var(--fg-dim);
        line-height: 1.7;
        word-break: break-all;
      }

      .banner {
        display: none;
        background: var(--ng);
        color: #fff;
        border-radius: 12px;
        padding: 14px 16px;
        font-size: 14px;
        line-height: 1.6;
        margin-bottom: 20px;
      }

      .banner.show {
        display: block;
      }

      /* --- トースト --- */
      .toast {
        position: fixed;
        left: 50%;
        bottom: 28px;
        transform: translate(-50%, 20px);
        max-width: min(440px, calc(100vw - 32px));
        padding: 14px 20px;
        border-radius: 12px;
        color: #fff;
        font-size: 15px;
        line-height: 1.6;
        text-align: center;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.2s ease, transform 0.2s ease;
        box-shadow: 0 6px 24px rgba(0, 0, 0, 0.25);
      }

      .toast.show {
        opacity: 1;
        transform: translate(-50%, 0);
      }

      .toast.ok {
        background: var(--ok);
      }

      .toast.ng {
        background: var(--ng);
      }
    </style>
  </head>

  <body>
    <div class="wrap">
      <div class="head">
        <span class="date" id="date">読み込み中…</span>
        <span class="badge" id="state">—</span>
      </div>

      <div class="banner" id="banner" role="alert"></div>

      <div class="history" id="history"></div>

      <!--
        ボタンのラベルは PUNCH_TYPES の title と一致させる（PLAN.md §2.4）。
        title は種別判定のキーでもあり、確定後は変更しない。
        data-type がサーバーに渡す識別子で、allowed との突き合わせにも使う。
      -->
      <div class="buttons">
        <button class="punch" type="button" data-type="officeIn" data-group="in" disabled>
          リアル出社
        </button>
        <button class="punch" type="button" data-type="remoteIn" data-group="in" disabled>
          リモート出社
        </button>
        <button class="punch" type="button" data-type="officeOut" data-group="out" disabled>
          リアル退社
        </button>
        <button class="punch" type="button" data-type="remoteOut" data-group="out" disabled>
          リモート退社
        </button>
        <button class="punch" type="button" data-type="breakIn" data-group="break" disabled>
          休憩開始
        </button>
        <button class="punch" type="button" data-type="breakOut" data-group="break" disabled>
          休憩終了
        </button>
      </div>

      <div class="guests" id="guests"></div>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script>
      /**
       * クライアントロジック。
       * サーバー呼び出しは google.script.run のみ（ADR-0005）。
       *
       * 打刻の可否を判断するのはサーバーだけである（ADR-0018）。
       * ここでの非活性化は多層防御の一層目にすぎず、
       * 遷移表をクライアントに持たない。見るのは Status.allowed だけ（PLAN.md §4.1）。
       */

      var el = {
        date: document.getElementById('date'),
        state: document.getElementById('state'),
        banner: document.getElementById('banner'),
        history: document.getElementById('history'),
        guests: document.getElementById('guests'),
        toast: document.getElementById('toast')
      };

      var buttons = Array.prototype.slice.call(
        document.querySelectorAll('button.punch')
      );

      /** 状態の呼称。表示専用であり、遷移の判断には使わない */
      var STATE_LABELS = {
        offDuty: '勤務外',
        onDuty: '勤務中',
        onBreak: '休憩中'
      };

      var STATE_CLASSES = {
        onDuty: 'on-duty',
        onBreak: 'on-break'
      };

      var busy = false;
      var lastStatus = null;
      var toastTimer = null;

      /**
       * google.script.run をコールバックから Promise に包む。
       * 引数なしのサーバー関数に undefined を渡すと google.script.run が
       * 引数を直列化できずに失敗するため、arg の有無で呼び分ける。
       */
      function call(fnName, arg) {
        return new Promise(function (resolve, reject) {
          var runner = google.script.run
            .withSuccessHandler(resolve)
            .withFailureHandler(reject);
          if (arg === undefined) {
            runner[fnName]();
          } else {
            runner[fnName](arg);
          }
        });
      }

      function toast(message, kind) {
        clearTimeout(toastTimer);
        el.toast.textContent = message;
        el.toast.className = 'toast show ' + kind;
        toastTimer = setTimeout(function () {
          el.toast.className = 'toast ' + kind;
        }, 4500);
      }

      function formatDate(iso) {
        var p = String(iso || '').split('-');
        if (p.length !== 3) return '';
        var days = ['日', '月', '火', '水', '木', '金', '土'];
        var d = new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]));
        return p[0] + '年' + Number(p[1]) + '月' + Number(p[2]) + '日（' +
          days[d.getDay()] + '）';
      }

      function render(status) {
        lastStatus = status;
        el.date.textContent = formatDate(status.date);

        el.state.textContent = STATE_LABELS[status.state] || '—';
        el.state.className = 'badge ' + (STATE_CLASSES[status.state] || '');

        renderHistory(status.punches);

        if (status.error) {
          el.banner.textContent = status.error;
          el.banner.classList.add('show');
        } else {
          el.banner.classList.remove('show');
        }

        el.guests.textContent = status.guests && status.guests.length
          ? '招待先: ' + status.guests.join(' / ')
          : '';

        updateButtons();
      }

      /**
       * 当日の打刻履歴を描く。
       *
       * 履歴は当日分、状態は前日 0:00 からの窓で導出されるため、
       * 日を跨いだ勤務では「履歴が空なのに勤務中」が正常に起こりうる。
       * これを異常として扱わない（PLAN.md §4.1）。
       */
      function renderHistory(punches) {
        el.history.textContent = '';

        if (!punches || !punches.length) {
          var empty = document.createElement('div');
          empty.className = 'history-empty';
          empty.textContent = '本日の打刻はまだありません';
          el.history.appendChild(empty);
          return;
        }

        punches.forEach(function (p) {
          var row = document.createElement('div');
          row.className = 'punch-row';

          var time = document.createElement('span');
          time.className = 'punch-time';
          time.textContent = p.time;

          var title = document.createElement('span');
          title.className = 'punch-title';
          title.textContent = p.title;

          row.appendChild(time);
          row.appendChild(title);
          el.history.appendChild(row);
        });
      }

      /** 活性判定は allowed に含まれるかどうかだけを見る */
      function updateButtons() {
        var s = lastStatus;
        var blocked = busy || !s || !!s.error;
        var allowed = (s && s.allowed) || [];

        buttons.forEach(function (node) {
          node.disabled = blocked || allowed.indexOf(node.dataset.type) === -1;
          node.textContent = node.dataset.label;
        });
      }

      function punch(node) {
        if (busy || node.disabled) return;

        busy = true;
        updateButtons();
        node.innerHTML = '<span class="spinner"></span>' + node.dataset.label;

        call('punch', node.dataset.type)
          .then(function (result) {
            busy = false;
            render(result.status);
            toast(
              result.ok ? result.message : result.error,
              result.ok ? 'ok' : 'ng'
            );
          })
          .catch(function (err) {
            busy = false;
            updateButtons();
            toast(
              '通信に失敗しました。カレンダーを確認してから再実行してください。' +
                (err && err.message ? '\n' + err.message : ''),
              'ng'
            );
          });
      }

      function refresh() {
        return call('getStatus')
          .then(render)
          .catch(function (err) {
            el.date.textContent = '';
            el.banner.textContent =
              '状況を読み込めませんでした: ' +
              (err && err.message ? err.message : '不明なエラー');
            el.banner.classList.add('show');
          });
      }

      buttons.forEach(function (node) {
        // HTML 側のラベルを正とし、スピナー表示から戻すときの復元元にする
        node.dataset.label = node.textContent.trim();
        node.textContent = node.dataset.label;
        node.addEventListener('click', function () {
          punch(node);
        });
      });

      // 日付を跨いだ後や、バックグラウンドから戻ったときに状態がずれないよう
      // 再表示のたびに取り直す。
      document.addEventListener('visibilitychange', function () {
        if (!document.hidden && !busy) refresh();
      });

      refresh();
    </script>
  </body>
</html>
